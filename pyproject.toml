[project]
name = "fabsentinel"
version = "0.1.0"
description = "SPC, virtual metrology, and excursion RCA for semiconductor manufacturing"
authors = [{name = "kbd0011"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "shap>=0.46",
    "imbalanced-learn>=0.13",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "loguru>=0.7",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.20",
    "streamlit>=1.36",
    "jinja2>=3.1",
    "mlflow>=2.14",
    "joblib>=1.4",
    "openai>=1.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[project.scripts]
fabsentinel = "fabsentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabsentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: full pipeline integration",
]
